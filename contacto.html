<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container">
                <a class="navbar-brand" href="index.html">CitaFácil</a>

                    aria-controls="menu" aria-expanded="false" aria-label="Abrir menú">

    <main>
        <div class="container my-5">
    <h1 class="text-center mb-4">Contáctanos</h1>
    <div id="contenedor-formulario">
        <form>
    <form>
    <div class="mb-3">
        <label for="nombre" class="form-label">Nombre completo</label>
        <input type="text" class="form-control" id="nombre" required>
    </div>
    <div class="mb-3">
        <label for="telefono" class="form-label">Teléfono</label>
        <input type="tel" class="form-control" id="telefono" minlength="10" required>
    </div>
    <div class="mb-3">
        <label for="correo" class="form-label">Correo electrónico</label>
        <input type="email" class="form-control" id="correo" required>
    </div>
    <div class="mb-3">
        <label for="mensaje" class="form-label">Mensaje</label>
        <textarea class="form-control" id="mensaje" rows="3" required></textarea>
    </div>
    <button type="submit" class="btn btn-primary w-100 mt-2">Enviar mensaje</button>
</form>
</form>
    </div>
</div>
    </main>

    <footer class="py-3 text-center">
        <p class="mb-0">CitaFácil · Tu tiempo también importa</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
