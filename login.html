<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CitaFácil | Iniciar sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <header>
        <a class="visually-hidden-focusable" href="#contenido">Saltar al contenido</a>
        <nav class="navbar navbar-expand-lg bg-body-tertiary" aria-label="Menú del consultorio">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center" href="panel.html"><img src="img/logo-app.png"
                        alt="Logo CitaFácil" width="30" height="30" class="me-2">CitaFácil</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                    aria-controls="menu" aria-expanded="false" aria-label="Abrir menú"><span
                        class="navbar-toggler-icon"></span></button>
                <div class="collapse navbar-collapse" id="menu">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Volver al inicio</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main id="contenido">
        <section class="encabezado-pagina">
            <div class="container">

                <h1><i class="bi bi-person-lock" aria-hidden="true"></i> Iniciar sesión</h1>
                <p class="mb-0">Acceso para médicos y recepcionistas del consultorio.</p>
            </div>
        </section>
        <div class="container panel-app">

            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-5">
                    <form class="form-app" action="panel.html" method="get">
                        <div class="mb-3"><label for="usuario" class="form-label">Usuario</label><input type="text"
                                class="form-control" id="usuario" name="usuario" autocomplete="username" required></div>
                        <div class="mb-3">
                            <label for="clave" class="form-label">Contraseña</label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="clave" name="clave"
                                    autocomplete="current-password" minlength="8" required>
                                <button class="btn btn-outline-primary" type="button" id="btnVerClave"
                                    aria-label="Mostrar contraseña">
                                    <i class="bi bi-eye" aria-hidden="true"></i>
                                </button>
                            </div>
                        </div>
                        <div class="form-check mb-4"><input class="form-check-input" type="checkbox" id="recordar"
                                name="recordar"><label class="form-check-label" for="recordar">Mantener sesión
                                iniciada</label></div>
                        <button type="submit" class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right"
                                aria-hidden="true"></i> Entrar</button>
                        <p class="text-center mt-3 mb-0"><a href="contacto.html">¿Olvidaste tu contraseña? Contacta al
                                administrador</a></p>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="py-3 text-center">
        <p class="mb-0">CitaFácil · Tu tiempo también importa</p>
        <p class="mb-0">&copy; 2026 CitaFácil. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/password.js"></script>
</body>

</html>
